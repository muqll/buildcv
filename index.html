<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صانع السير الذاتية الاحترافي</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- ملف الـ CSS المحدث -->
  <link rel="stylesheet" href="cv.css">

  <!-- مكتبة تحويل الـ HTML إلى PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>

<body>

  <header class="app-header">
    <div class="logo">
      <span>CV</span>Maker
    </div>
    <div class="header-controls">
      <label for="langSelect">لغة السيفي:</label>
      <select id="langSelect" class="custom-select">
        <option value="ar">العربية (Arabic)</option>
        <option value="en">English</option>
      </select>
    </div>
  </header>

  <main class="app-container">

    <!-- لوحة التحكم وإدخال البيانات (بتيجي فوق في الموبايل) -->
    <section class="builder-panel">
      
      <!-- تخصيص الشكل واللون -->
      <div class="control-card">
        <h3>1. تخصيص التصميم</h3>
        <div class="form-group">
          <label for="templateSelect">اختر قالب السيفي:</label>

          <select id="templateSelect" class="custom-select">
            <option value="1">شكل 1 (كلاسيك)</option>
            <option value="2">شكل 2 (جانبي ملون)</option>
            <option value="3">شكل 3 (مودرن)</option>
            <option value="4">شكل 4 (أنيق وفاخر)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="themeColor">لون السيفي الأساسي:</label>
          <input type="color" id="themeColor" value="#593BFE">
        </div>
      </div>

      <!-- البيانات الشخصية -->
      <div class="control-card">
        <h3>2. البيانات الشخصية</h3>
        <div class="form-group">
          <label for="photo">الصورة الشخصية (اختياري):</label>

          <input type="file" id="photo" accept="image/*">
        </div>
        <div class="form-group">
          <label for="name">الاسم بالكامل:</label>
          <input type="text" id="name" placeholder="مثلاً: سلطان الأحمد">
        </div>
        <div class="form-group">
          <label for="title">المسمى الوظيفي:</label>
          <input type="text" id="title" placeholder="مثلاً: مهندس برمجيات">
        </div>
        <div class="form-group">
          <label for="email">البريد الإلكتروني:</label>
          <input type="email" id="email" placeholder="name@example.com">
        </div>
        <div class="form-group">
          <label for="phone">رقم الهاتف:</label>
          <input type="text" id="phone" placeholder="+966 5xx xxx xxx">
        </div>
        <div class="form-group">
          <label for="about">نبذة عنك (اختياري):</label>
          <textarea id="about" rows="3" placeholder="اكتب نبذة مختصرة عن خبرتك..."></textarea>
        </div>
      </div>

      <!-- التعليم والشهادات (اختياري) -->
      <div class="control-card">
        <h3>3. التعليم والشهادات (اختياري)</h3>
        <div class="form-group">
          <label for="school">الجامعة / الكلية:</label>
          <input type="text" id="school" placeholder="مثلاً: جامعة الملك سعود - علوم حاسب">
        </div>
        <div class="form-group">
          <label for="degree">الدرجة العلمية / سنة التخرج:</label>
          <input type="text" id="degree" placeholder="مثلاً: بكالوريوس - 2025">
        </div>
      </div>

      <!-- الخبرات العملية (اختياري) -->
      <div class="control-card">
        <h3>4. الخبرات العملية (اختياري)</h3>
        <div class="form-group">
          <label for="company">الشركة / المؤسسة:</label>

          <input type="text" id="company" placeholder="مثلاً: شركة المدار للبرمجيات">
        </div>
        <div class="form-group">
          <label for="jobTitle">المسمى الوظيفي بالشركة:</label>
          <input type="text" id="jobTitle" placeholder="مثلاً: مطور فرونت إند">
        </div>
        <div class="form-group">
          <label for="jobDesc">وصف المهام:</label>
          <textarea id="jobDesc" rows="2" placeholder="تطوير واجهات المستخدم باستخدام JavaScript..."></textarea>
        </div>
      </div>

      <!-- المهارات (اختياري) -->
      <div class="control-card">
        <h3>5. المهارات (اختياري)</h3>
        <div class="form-group">
          <label for="skills">المهارات (افصل بينها بـ فاصلة ,):</label>
          <input type="text" id="skills" placeholder="HTML, CSS, JavaScript, Problem Solving">
        </div>
      </div>

    </section>

    <!-- لوحة المعاينة (بتيجي تحت في الموبايل وبجنب البيانات في الكمبيوتر) -->
    <section class="preview-panel">
      <div class="preview-actions">
        <button id="printBtn" class="btn-primary">تحميل السيفي PDF ⬇️</button>
      </div>

      <div id="cvPaper" class="cv-paper">
        <!-- يتم توليد كود السيفي هنا تلقائياً -->
      </div>
    </section>

  </main>

  <footer class="app-footer">
    <p>تم تطوير بواسطة <strong>مؤمن يوسف</strong> &copy; 2026</p>
  </footer>

  <!-- السكربتات الخاصة بالتطبيق -->
  <script src="templates/template1.js"></script>
  <script src="templates/template2.js"></script>
  <script src="templates/template3.js"></script>
  <script src="templates/template4.js"></script>
  <script src="app.js"></script>
</body>
</html>
